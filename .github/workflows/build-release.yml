# 115US 编译发布壳仓库（源码不在本仓库）
#
# 架构：
#   - 源码唯一真源：gitgud.io/RicardoLz/115-us（master）
#   - 本仓库（github.com/RicardoLz/115）只存放本工作流，不存放任何源码；
#     每次运行都从 gitgud 拉取最新源码，编译后发布到 GitHub Release。
#
# 触发方式：
#   - workflow_dispatch：在 Actions 页面手动运行
#   - schedule：每天 UTC 01:00（= 北京时间 09:00）自动检测
#
# 更新检测逻辑：
#   1. git ls-remote 读取 gitgud master 当前 HEAD；
#   2. 若该提交已存在对应 Release（tag = us-<完整sha>）→ 无更新，跳过本次；
#   3. 否则 clone gitgud 源码 → 编译服务端 exe + 探针 + r7 补丁 DLL → 组装 zip
#      → 上传 Actions Artifact 并创建 GitHub Release（附件 = 发布包 zip）。

name: build-release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 01:00 = 北京时间 09:00

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检测 gitgud 源码更新
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = (git ls-remote https://gitgud.io/RicardoLz/115-us.git refs/heads/master | ForEach-Object { ($_ -split '\s+')[0] })
          if (-not $head) { Write-Error "无法读取 gitgud 源码 HEAD" }
          Write-Host "gitgud master HEAD = $head"
          $tag = "us-$head"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "该提交已构建过（$tag），gitgud 无新更新，跳过本次"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "检测到 gitgud 新提交，开始构建"
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "head=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: 拉取 gitgud 源码（不入本仓库）
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: git clone --depth 1 --branch master https://gitgud.io/RicardoLz/115-us.git src

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip == 'false'
        with:
          go-version: '1.26.x'
          cache-dependency-path: src/server/work/dfo-lan/go.sum

      - name: 编译并组装发布包
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          VCVARS64: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat
        run: ./src/scripts/build-release-package.ps1 -OutDir "$env:RUNNER_TEMP\release-out"

      - name: 上传构建产物（Actions Artifact）
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dfo-115us-build-${{ steps.check.outputs.head }}
          path: ${{ runner.temp }}\release-out\*.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "115US 构建 ${{ steps.check.outputs.head }} ($(Get-Date -Format 'yyyy-MM-dd HH:mm'))"
          $notes = "gitgud master 提交：${{ steps.check.outputs.head }}"
          gh release create "${{ steps.check.outputs.tag }}" "$env:RUNNER_TEMP\release-out\*.zip" `
            --repo $env:GITHUB_REPOSITORY --title $title --notes $notes
